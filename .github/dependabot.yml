version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Daily while Phase 3's pass test runs; back to weekly after it passes.
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    ignore:
      # The shared pipeline tracks main on purpose, and Dependabot cannot read
      # the private homelab-ops repo anyway.
      - dependency-name: "DevinMB/homelab-ops/*"
