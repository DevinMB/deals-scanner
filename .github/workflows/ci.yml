name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write       # the gate merges Dependabot PRs
  pull-requests: write  # ...and labels majors
  packages: write       # push to GHCR on main
  actions: write        # the gate starts the main build after merging
jobs:
  ci:
    # Shared pipeline: homelab-ops docs/app-onboarding.md
    uses: DevinMB/homelab-ops/.github/workflows/app-ci.yml@main
    with:
      image: ghcr.io/devinmb/deals-scanner
      test-command: python -m pytest -q
      # The smoke container gets no secrets: no scraping, no Telegram.
      smoke-env: |
        SCHEDULER=off
        DRY_RUN=1
